name: 链接有效性检查

on:
  schedule:
    # 每月 1 日 08:00 (UTC) 自动检查一次失效链接
    - cron: "0 8 1 * *"
  pull_request:
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Markdown 链接
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,204,206,301,302,308,429
            --max-retries 2
            --timeout 20
            "**/*.md"
          fail: false

      - name: 发现失效链接时创建 Issue
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "每月链接巡检：发现失效链接"
          content-filepath: ./lychee/out.md
          labels: link-check
