name: Link Check

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC 定期体检
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            --timeout 25
            --max-retries 3
            --retry-wait-time 5
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
